aid: joinmidi
name: Joinmidi
description: >-
  Joinmidi (Midi Health) is a virtual care company for women in midlife, providing insurance-covered
  telehealth from women's health specialists across all 50 states. Its clinicians deliver personalized,
  evidence-based care for perimenopause and menopause plus weight management, sexual wellness, mood,
  sleep, hair and skin health, and cancer survivorship, backed by custom prescription medications
  (Midi Custom Rx) and a targeted supplement line. Midi is NCQA accredited, works with major insurance
  plans, and partners with health systems and Fortune 100 employers as a covered benefit. Surfaced as a
  portfolio company of Felicis and added to the API Evangelist network; no public developer or API
  surface is currently published.
